plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    cybercontent {
        java.srcDir 'cybercontent/src/main/java'
        resources.srcDir 'cybercontent/src/main/resources'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    cybercontentImplementation.extendsFrom implementation
    cybercontentCompileOnly.extendsFrom compileOnly
    cybercontentRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CyberQuest-${mod_version}-forge-${minecraft_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('cyberContentJar', Jar) {
    dependsOn tasks.named('cybercontentClasses')
    from sourceSets.cybercontent.output
    archiveFileName = "CyberContent-0.1.0-alpha.1-forge-${minecraft_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : 'cybercontent',
                'Specification-Vendor'    : 'Cyberspectraa',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'CyberContent',
                'Implementation-Version'  : '0.1.0-alpha.1',
                'Implementation-Vendor'   : 'Cyberspectraa',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

reobf {
    cyberContentJar {}
}

tasks.named('cyberContentJar').configure {
    finalizedBy 'reobfCyberContentJar'
}

tasks.named('build').configure {
    dependsOn tasks.named('cyberContentJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
