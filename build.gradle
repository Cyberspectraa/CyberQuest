plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Pixel-art textures are deterministic outputs of tools/generate_vanilla_textures.py.
// A checked-in/local prebuilt ZIP is preferred for ordinary Gradle builds:
// it preserves the same pixels WITHOUT requiring Python/Pillow on every PC.
// The Python generator remains an opt-in authoring tool or a fallback when
// the archive is not installed. Never silently ship missing texture assets.
def prebuiltQuestTextures = file('tools/prebuilt-quest-textures.zip')
def questTextureGenerator = tasks.register('generateVanillaQuestTextures') {
    group = 'cyberquest authoring'
    description = 'Regenerate vanilla-style quest textures with Python and Pillow.'
    outputs.dir(file('src/generated/resources/assets/cyberquest/textures'))
    doLast {
        def commands = []
        def override = System.getenv('PYTHON')
        if (override != null && !override.isBlank()) commands.add([override])
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            commands.add(['py', '-3'])
            commands.add(['python'])
        } else {
            commands.add(['python3'])
            commands.add(['python'])
        }
        List<String> selected = null
        commands.each { cmd ->
            if (selected == null) {
                try {
                    def probe = project.exec {
                        commandLine(*(cmd + ['-c', 'from PIL import Image']))
                        ignoreExitValue = true
                        standardOutput = new java.io.ByteArrayOutputStream()
                        errorOutput = new java.io.ByteArrayOutputStream()
                    }
                    if (probe.exitValue == 0) selected = cmd
                } catch (Exception ignored) {
                    // Try the next available Python launcher.
                }
            }
        }
        if (selected == null) {
            throw new GradleException(
                'CyberQuest needs its original pixel textures. Either copy the ' +
                'prebuilt-quest-textures.zip into tools/, or install Python 3 ' +
                'and Pillow (python -m pip install Pillow).')
        }
        project.exec {
            commandLine(*(selected + ['tools/generate_vanilla_textures.py']))
        }
    }
}
tasks.named('processResources', ProcessResources).configure {
    if (prebuiltQuestTextures.isFile()) {
        // ZIP root contains assets/cyberquest/textures/... exactly as the JAR
        // needs it; preserve the artist-approved PNG pixels without regenerating.
        from(zipTree(prebuiltQuestTextures))
    } else {
        dependsOn questTextureGenerator
    }
}


dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    // ForgeGradle may register src/generated/resources twice. Both entries
    // refer to the same deterministic generated PNG bytes.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "CyberQuest-${mod_version}-forge-${minecraft_version}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
