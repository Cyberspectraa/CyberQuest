ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cyberraces"
mandatory=false
versionRange="[0.3.0-alpha.34,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cyberclasses"
mandatory=false
versionRange="[0.2.1-alpha.6,)"
ordering="AFTER"
side="BOTH"
